<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wb-obraz demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d10; color: #ccc; font: 13px system-ui, sans-serif; }
  #bar { height: 32px; display: flex; gap: 12px; align-items: center; padding: 0 12px; }
  #stage { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; display: flex; align-items: center;
           justify-content: center; padding: 12px; box-sizing: border-box; overflow: hidden; }
  .game { position: relative; line-height: 0; }
  .game canvas#screen { display: block; image-rendering: pixelated; background: #000; }
  .game .crt-layer { border: 0; background: none; width: auto; position: absolute; left: 0; top: 0; pointer-events: none;
                     image-rendering: pixelated; opacity: var(--crt-on, 0); transition: opacity .36s ease-in-out; }
  .game::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--crt-on, 0);
                 transition: opacity .36s ease-in-out; box-shadow: inset 0 0 42px rgba(0, 0, 0, var(--crt-edge, .5)); }
  .game.no-vignette::after { display: none; }
  .game[data-crt=fine] { --crt-edge: .25 } .game[data-crt=standard] { --crt-edge: .5 } .game[data-crt=strong] { --crt-edge: .65 }
  #menu { position: absolute; top: 32px; right: 0; width: 320px; max-height: calc(100% - 32px); overflow: auto; background: #16161c; padding: 8px 12px; box-sizing: border-box; }
  .wb-menu fieldset { border: 1px solid #333; margin: 0 0 8px; padding: 6px 8px; } .wb-menu legend { color: #fff; }
  .wb-menu-row { display: grid; grid-template-columns: 1fr 120px 36px; gap: 6px; align-items: center; margin: 4px 0; }
  .wb-menu-defaults { margin-top: 6px; }
</style>
</head>
<body>
<div id="bar"><span id="label"></span><button id="menu-toggle" type="button">Menu</button><button id="sound-test" type="button">Test sound</button></div>
<div id="stage"><div class="game"><canvas id="screen"></canvas><canvas class="crt-layer" aria-hidden="true"></canvas></div></div>
<div id="menu" hidden></div>
<script src="wb-obraz.js"></script>
<script src="wb-menu.js"></script>
<script src="wb-zvuk.js"></script>
<script>
'use strict';
// A game of W x H pixels, Original width W0 = W. Test hooks (arek web test):
//   wbObrazTest.set(mode, {zoom, detail, shape, crt, blur, par}) -> info ; wbObrazTest.fill('grey'|'rows'|'cols'|'picture')
const W = 320, H = 256, W0 = 320, O = WBOBRAZ;
const pic = document.createElement('canvas'); pic.width = W; pic.height = H;   // the game's own W x H picture (1.4: blit scales it)
const game = document.querySelector('.game'), screen = document.getElementById('screen'), stage = document.getElementById('stage');
const scr = new O.Screen(game, screen);
const state = { mode: 'original', cfg: JSON.parse(JSON.stringify(O.VIEW_DEFAULTS)), pattern: 'picture' };

function par() { const v = state.cfg[state.mode].par; return v > 0 ? v : 1; }
function limit() {
  const cs = getComputedStyle(stage);
  const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return Math.min(aw / (W * par()), ah / H);
}
let S = 1;
function paint() {
  if (state.pattern === 'picture') {                     // a synthetic picture: checker and colour bars, drawn at 1:1 and blitted
    const g = pic.getContext('2d');
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x += 8) {
      const c = ((x >> 3) + (y >> 3)) & 1 ? '#284878' : '#1a2a40';
      g.fillStyle = (x >> 3) % 10 === 0 ? ['#c33', '#3c3', '#33c', '#cc3', '#c3c', '#3cc', '#ccc', '#333'][(y >> 5) & 7] : c;
      g.fillRect(x, y, 8, 1);
    }
    const s = screen.getContext('2d'); s.fillStyle = '#000'; s.fillRect(0, 0, screen.width, screen.height);
    O.blit(screen, pic, W, H, S, par());
  } else O.testPattern(screen, state.pattern, W, H, S, par());
}
function layout() {
  const dpr = window.devicePixelRatio || 1, c = state.cfg[state.mode];
  S = O.deviceScale(c.zoom, W0, W, dpr, limit(), par());
  const [cw, ch] = O.contentSize(W, H, S, par());
  const bw = O.padded(cw, dpr), bh = O.padded(ch, dpr);            // the picture is cw x ch at the top left
  if (screen.width !== bw || screen.height !== bh) { screen.width = bw; screen.height = bh; }
  screen.style.width = bw / dpr + 'px'; screen.style.height = bh / dpr + 'px';
  screen.style.filter = O.filter({ blur: c.blur }, S / dpr);
  paint();
  const pd = scr.crt({ mode: state.mode, detail: c.crtDetail, shape: c.crtShape, S, dpr, w: bw, h: bh, on: c.crt ? 1 : 0 });
  scr.align();
  document.getElementById('label').textContent = O.zoomLabel(c.zoom, S, dpr, W0, W, null, par()) + ' · ' + state.mode;
  return Object.assign(scr.info(), { scale: S, dpr, W, H, P: pd.P, D: pd.D, par: par(), content: [cw, ch] });
}
window.display = () => Object.assign(scr.info(), { scale: S, dpr: window.devicePixelRatio || 1, par: par(), content: O.contentSize(W, H, S, par()) });
window.wbObrazTest = {
  set(mode, cfg) { state.mode = mode; Object.assign(state.cfg[mode], cfg || {}); return layout(); },
  fill(kind) { state.pattern = kind; game.classList.toggle('no-vignette', kind !== 'picture'); paint(); return true; },
};
// the shared menu (wb-menu.js): its Display values drive this page's cfg, its Sound values the sound chain
const menu = WBMENU.build(document.getElementById('menu'), { lang: 'en' });
function fromMenu(st) {
  const d = st.display;
  state.cfg[st.mode] = { zoom: d.zoom, crt: d.crt, crtDetail: d['crt-detail'], crtShape: d['crt-shape'], blur: d.blur, par: d.par };
  if (state.mode === st.mode) layout();
  if (zvuk) WBZVUK.apply(zvuk, toSound(st.sound), false);
}
const toSound = (so) => ({ on: so.sound, volume: so.volume, stereo: so.stereo, filterFixed: so['filter-fixed'], filterLed: so['filter-led'], filterHp: so['filter-hp'] });
menu.on('change', fromMenu);
document.getElementById('menu-toggle').addEventListener('click', () => { const m = document.getElementById('menu'); m.hidden = !m.hidden; });
let zvuk = null, osc = null;
document.getElementById('sound-test').addEventListener('click', () => {           // a user gesture: a short test tone through the chain
  const ctx = new AudioContext(); zvuk = WBZVUK.chain(ctx); WBZVUK.apply(zvuk, toSound(menu.get('sound')), false, 0);
  const src = ctx.createBufferSource(), sig = WBZVUK.testSignal(ctx.sampleRate, ctx.sampleRate), buf = ctx.createBuffer(2, sig.l.length, ctx.sampleRate);
  buf.copyToChannel(sig.l, 0); buf.copyToChannel(sig.r, 1); src.buffer = buf; src.connect(zvuk.input); src.start();
});
const SIG = WBZVUK.testSignal(4096, 44100);
window.wbMenuTest = menu.testHooks();
window.wbZvukTest = {
  version: WBZVUK.VERSION,
  signal: () => ({ l: Array.from(SIG.l), r: Array.from(SIG.r) }),
  render: (settings, led) => WBZVUK.render(settings, !!led, SIG, 44100),
  reference: (settings, led) => { const [l, r] = WBZVUK.process(SIG.l, SIG.r, settings, !!led, 44100); return { l: Array.from(l), r: Array.from(r) }; },
};
addEventListener('resize', layout);
layout();
</script>
</body>
</html>
