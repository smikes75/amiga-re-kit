[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amiga-re-kit"
dynamic = ["version"]
description = "Measured reverse engineering of Amiga floppy games: ADF/HUNK/packers, a strict 68000 decoder and static recompiler, headless vAmiga capture, and an MCP server so coding agents can use all of it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY.md"]
authors = [{ name = "smikes75" }]
keywords = ["amiga", "68000", "reverse-engineering", "adf", "powerpacker", "bytekiller", "vamiga", "mcp", "recompiler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Disassemblers",
  "Topic :: System :: Emulators",
]
dependencies = []

[project.optional-dependencies]
png = []                # kept for old install lines: PNG output needs no extra package since 0.4.4
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2"]
web = ["playwright>=1.40", "cryptography>=41"]

[project.scripts]
arek = "arek.cli:main"
arek-mcp = "arek.mcp_server:main"

[project.urls]
Homepage = "https://github.com/smikes75/amiga-re-kit"
"SWIV (reference project)" = "https://github.com/smikes75/swiv-amiga-re"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "arek.__version__"}

[tool.setuptools.package-data]
"arek.headless" = ["patches/*.patch", "selftest_display.s", "selftest_bus.s", "selftest_audio.s"]
"arek.web" = ["wb-obraz.js", "wb-seal.js", "wb-nastaveni.js", "wb-zvuk.js", "wb-atn.js", "wb-content.js", "wb-touch.js", "demo.html"]
"arek.bus" = ["*.c", "*.h"]
"arek.host" = ["*.c", "*.h", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
